<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Speech Recognition & Correction Demo</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 2rem;
    background:#f0f0f0;
    color: #222;
  }
  .container {
    max-width: 600px;
    background: white;
    padding: 1rem 2rem 2rem 2rem;
    border-radius: 8px;
    box-shadow: 0 0 12px rgba(0,0,0,0.1);
    margin: auto;
  }
  h1 {
    text-align: center;
  }
  button {
    background-color: #007bff;
    border: none;
    color: white;
    padding: 1rem 2rem;
    margin: 1rem 0;
    border-radius: 5px;
    cursor: pointer;
    font-size: 1rem;
  }
  button:disabled {
    background-color: #ccc;
    cursor: not-allowed;
  }
  #status {
    font-weight: bold;
    margin-bottom: 1rem;
    text-align: center;
  }
  #correctedText {
    width: 100%;
    height: 120px;
    margin-top: 1rem;
    font-size: 1rem;
    padding: 0.5rem;
  }
  .download-links {
    margin-top:1rem;
    text-align:center;
  }
  .download-links a {
    margin: 0 1rem;
    color: #007bff;
    text-decoration: none;
    font-weight: bold;
      }
  .download-links a:hover {
    text-decoration: underline;
  }
  audio {
    margin-top: 1rem;
    width: 100%;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>Speech Recognition & Correction</h1>
    <p id="status">Press Start to record your voice (max 5 seconds).</p>
    <button id="recordBtn">Start Recording</button>

    <label for="correctedText">Corrected Text:</label>
    <textarea id="correctedText" readonly></textarea>

    <audio id="audioPlayer" controls></audio>

    <div class="download-links" style="display:none;">
      <a id="downloadText" href="#" download="corrected_text.txt">Download Corrected Text</a>
      <a id="downloadAudio" href="#" download="corrected_audio.mp3">Download Corrected Audio</a>
    </div>
  </div>
  <script>
  const recordBtn = document.getElementById('recordBtn');
  const status = document.getElementById('status');
  const correctedTextArea = document.getElementById('correctedText');
  const audioPlayer = document.getElementById('audioPlayer');
  const downloadDiv = document.querySelector('.download-links');
  const downloadTextLink = document.getElementById('downloadText');
  const downloadAudioLink = document.getElementById('downloadAudio');

  let mediaRecorder;
  let audioChunks = [];

  function resetUI() {
    correctedTextArea.value = '';
    audioPlayer.src = '';
    downloadDiv.style.display = 'none';
    downloadTextLink.href = '#';
    downloadAudioLink.href = '#';
  }

  recordBtn.addEventListener('click', async () => {
    resetUI();
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      alert('Your browser does not support audio recording.');
      return;
    }
    recordBtn.disabled = true;
    status.textContent = 'Getting microphone access...';

    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);

      mediaRecorder.ondataavailable = e => {
        if (e.data && e.data.size > 0) {
          audioChunks.push(e.data);
        }
      };

      mediaRecorder.onstop = async () => {
        status.textContent = 'Processing audio, please wait...';

        const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
        audioChunks = [];

        // Convert Blob to ArrayBuffer then to Int16 PCM using Web Audio API
        const arrayBuffer = await audioBlob.arrayBuffer();
        const audioContext = new AudioContext();
        const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);

        // Resample to 16000 Hz and convert to PCM Int16
        const resampled = await resampleAudioBuffer(audioBuffer, 16000);
        const int16Array = floatTo16BitPCM(resampled);

        // Prepare file to send to backend
        const wavBlob = encodeWAV(int16Array, 1, 16000);
        const file = new File([wavBlob], 'recorded_audio.wav', { type: 'audio/wav' });

        const formData = new FormData();
        formData.append('audio_data', file);

        fetch('/api/record', {
          method: 'POST',
          body: formData
        })
        .then(res => res.json())
        .then(data => {
          if (data.error) {
            status.textContent = 'Error: ' + data.error;
          } else {
            status.textContent = 'Transcription & Correction Complete.';
            correctedTextArea.value = data.corrected_text;

            // Audio base64 to blob url
            const audioSrc = 'data:audio/mpeg;base64,' + data.audio_base64;
            audioPlayer.src = audioSrc;
            // Download links
            const textBlob = new Blob([data.corrected_text], { type: 'text/plain' });
            const textUrl = URL.createObjectURL(textBlob);
            downloadTextLink.href = textUrl;

            const audioBlob = base64ToBlob(data.audio_base64, 'audio/mpeg');
            const audioUrl = URL.createObjectURL(audioBlob);
            downloadAudioLink.href = audioUrl;

            downloadDiv.style.display = 'block';
          }
          recordBtn.disabled = false;
        })
        .catch(err => {
          status.textContent = 'Error: ' + err;
          recordBtn.disabled = false;
        });
      };

      mediaRecorder.start();
      status.textContent = 'Recording... 5 seconds';
      
      setTimeout(() => {
        mediaRecorder.stop();
        stream.getTracks().forEach(track => track.stop());
      }, 5000);
      } catch (err) {
      status.textContent = 'Could not start recording: ' + err;
      recordBtn.disabled = false;
    }
  });

  // Helper: Resample AudioBuffer to target sample rate (returns Float32Array)
  async function resampleAudioBuffer(buffer, targetSampleRate) {
    if (buffer.sampleRate === targetSampleRate) {
      return buffer.getChannelData(0);
    }
    const offlineCtx = new OfflineAudioContext(1, buffer.duration * targetSampleRate, targetSampleRate);
    const source = offlineCtx.createBufferSource();
    source.buffer = buffer;
    source.connect(offlineCtx.destination);
    source.start(0);
    const renderedBuffer = await offlineCtx.startRendering();
    return renderedBuffer.getChannelData(0);
  }

  // Convert float32 [-1..1] to Int16 PCM
  function floatTo16BitPCM(input) {
    const output = new Int16Array(input.length);
    for(let i=0; i < input.length; i++){
      let s = Math.max(-1, Math.min(1, input[i]));
      output[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
    }
    return output;
  }
    // WAV Encoder (mostly for header and data packaging)
  function encodeWAV(samples, numChannels, sampleRate) {
    const buffer = new ArrayBuffer(44 + samples.length * 2);
    const view = new DataView(buffer);

    /* RIFF identifier */
    writeString(view, 0, 'RIFF');
    /* file length */
    view.setUint32(4, 36 + samples.length * 2, true);
    /* RIFF type */
    writeString(view, 8, 'WAVE');
    /* format chunk identifier */
    writeString(view, 12, 'fmt ');
    /* format chunk length */
    view.setUint32(16, 16, true);
    /* sample format (raw) */
    view.setUint16(20, 1, true);
    /* channel count */
    view.setUint16(22, numChannels, true);
    /* sample rate */
    view.setUint32(24, sampleRate, true);
    /* byte rate (sample rate * block align) */
    view.setUint32(28, sampleRate * numChannels * 2, true);
    /* block align (channel count * bytes per sample) */
    view.setUint16(32, numChannels * 2, true);
    /* bits per sample */
    view.setUint16(34, 16, true);
    /* data chunk identifier */
    writeString(view, 36, 'data');
    /* data chunk length */
    view.setUint32(40, samples.length * 2, true);

    // Write the PCM samples
    let offset = 44;
    for (let i = 0; i < samples.length; i++, offset += 2) {
      view.setInt16(offset, samples[i], true);
    }

    return new Blob([view], { type: 'audio/wav' });
  }

  function writeString(view, offset, string) {
    for (let i = 0; i < string.length; i++) {
      view.setUint8(offset + i, string.charCodeAt(i));
    }
  }

  function base64ToBlob(base64, type = '') {
    const binary = atob(base64);
    const array = [];
    for (let i = 0; i < binary.length; i++) {
      array.push(binary.charCodeAt(i));
    }
    return new Blob([new Uint8Array(array)], {type: type});
  }
</script>

</body>
</html>
